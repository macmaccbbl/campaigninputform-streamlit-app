name: Tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run campaign data tests
        run: python -m unittest discover -s tests -v
